
<!DOCTYPE html>
<html>
<head>
    <title>Multi Number Calculator</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eaf0f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .calculator {
            background: white;
            padding: 30px;
            border-radius: 15px;
            width: 380px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }

        h1 {
            text-align: center;
            color: #243b55;
        }

        label {
            display: block;
            margin-top: 18px;
            font-weight: bold;
        }

        input, select, button {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            box-sizing: border-box;
            border-radius: 7px;
            border: 1px solid #ccc;
            font-size: 16px;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            cursor: pointer;
            margin-top: 22px;
        }

        button:hover {
            background: #1d4ed8;
        }

        .result {
            color: green;
            text-align: center;
            margin-top: 20px;
            overflow-wrap: anywhere;
        }

        .error {
            color: red;
            text-align: center;
            margin-top: 20px;
        }

        .hint {
            color: #666;
            font-size: 13px;
        }
    </style>
</head>

<body>

<div class="calculator">

    <h1>Multi Number Calculator</h1>

    <form method="POST">

        <label>Enter Numbers</label>

        <input
            type="text"
            name="numbers"
            placeholder="Example: 10, 20, 30, 40"
            required
        >

        <p class="hint">Separate numbers using commas.</p>

        <label>Select Operation</label>

        <select name="operation" required>
            <option value="add">Addition (+)</option>
            <option value="subtract">Subtraction (-)</option>
            <option value="multiply">Multiplication (×)</option>
            <option value="divide">Division (÷)</option>
        </select>

        <button type="submit">Calculate</button>

    </form>

    {% if result is not none %}
        <h2 class="result">Result: {{ result }}</h2>
    {% endif %}

    {% if error %}
        <h2 class="error">{{ error }}</h2>
    {% endif %}

</div>

</body>
</html>
